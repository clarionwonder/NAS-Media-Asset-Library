name: Index Drive & AI auto-tag
on:
  schedule:
    - cron: "17 * * * *"      # setiap jam (minit ke-17)
  workflow_dispatch:
concurrency:
  group: indexer
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      GDRIVE_SA_JSON: ${{ secrets.GDRIVE_SA_JSON }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: indexer/requirements.txt
      - run: pip install -r indexer/requirements.txt
      - name: Semak secrets
        run: |
          [ -n "$SUPABASE_SERVICE_KEY" ] || { echo "::error::Secret SUPABASE_SERVICE_KEY belum ditetapkan"; exit 1; }
          [ -n "$GDRIVE_SA_JSON" ] || { echo "::error::Secret GDRIVE_SA_JSON belum ditetapkan"; exit 1; }
      - name: Index Google Drive
        working-directory: indexer
        run: python indexer.py --config config.actions.yaml
      - name: AI auto-tag
        if: env.ANTHROPIC_API_KEY != ''
        working-directory: indexer
        run: python autotag.py --config config.actions.yaml
